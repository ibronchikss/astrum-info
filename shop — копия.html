<div class="product-grid">
    <!-- 1. ПОДАРОК (Фиолетовое лицо) -->
    <button class="product-card pink">
        <span class="product-art">
            <span class="art-orbit"></span>
            <img src="assets/images/gift_face.png" alt="Подарок" style="width: 76px; height: 76px; object-fit: contain; position: relative; z-index: 2;">
            <span class="art-spark">✦</span>
        </span>
        <span class="product-type">КАТЕГОРИЯ МАГАЗИНА</span>
        <span class="product-name">Подарок</span>
        <span class="product-bottom">
            <span>49 <small>₽</small></span>
            <span class="round-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </span>
        </span>
    </button>

    <!-- 2. PLUS (Звездочка) -->
    <button class="product-card purple">
        <span class="product-art">
            <span class="art-orbit"></span>
            <img src="assets/images/star_plus.png" alt="PLUS" style="width: 76px; height: 76px; object-fit: contain; position: relative; z-index: 2;">
            <span class="art-spark">✦</span>
        </span>
        <span class="product-type">ОСОБЫЙ СТАТУС</span>
        <span class="product-name">Подписка PLUS</span>
        <span class="product-bottom">
            <span><small>от </small>199 <small>₽</small></span>
            <span class="round-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </span>
        </span>
    </button>

    <!-- 3. ПРОХОДКА (Билеты) -->
    <button class="product-card green">
        <span class="product-art">
            <span class="art-orbit"></span>
            <img src="assets/images/tickets_pass.png" alt="Проходка" style="width: 76px; height: 76px; object-fit: contain; position: relative; z-index: 2;">
            <span class="art-spark">✦</span>
        </span>
        <span class="product-type">НАЧАЛО ПРИКЛЮЧЕНИЯ</span>
        <span class="product-name">Проходка</span>
        <span class="product-bottom">
            <span>149 <small>₽</small></span>
            <span class="round-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </span>
        </span>
    </button>

    <!-- 4. КАСТОМНЫЙ ПРЕФИКС (Шар) -->
    <button class="product-card orange">
        <span class="product-art">
            <span class="art-orbit"></span>
            <img src="assets/images/sphere_prefix.png" alt="Кастомный префикс" style="width: 76px; height: 76px; object-fit: contain; position: relative; z-index: 2;">
            <span class="art-spark">✦</span>
        </span>
        <span class="product-type">ИНДИВИДУАЛЬНОСТЬ</span>
        <span class="product-name">Кастомный префикс</span>
        <span class="product-bottom">
            <span>999 <small>₽</small></span>
            <span class="round-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </span>
        </span>
    </button>

    <!-- 5. РАЗБАН / РАЗМУТ (Замок) -->
    <button class="product-card blue">
        <span class="product-art">
            <span class="art-orbit"></span>
            <img src="assets/images/lock_unban.png" alt="Разбан / Размут" style="width: 76px; height: 76px; object-fit: contain; position: relative; z-index: 2;">
            <span class="art-spark">✦</span>
        </span>
        <span class="product-type">ЧЕРЕЗ ПОДДЕРЖКУ</span>
        <span class="product-name">Разбан / Размут</span>

            <span><small>от </small>49 <small>₽</small></span>

                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </span>
        </span>
